[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmc-aasm-temporal-r1"
version = "0.1.0"
requires-python = ">=3.12"
description = "Controlled temporal repair with byte-identical frozen V2 detector dependency"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "pandas==3.1.1", "mne==1.10.2", "yasa==0.6.5", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
